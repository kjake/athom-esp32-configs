name: CI

on:
  pull_request:
    paths:
      - "*.yaml"
      - "common/**"
      - "upstream/**"
      - ".github/test-configs/**"
      - ".github/workflows/ci.yml"
  push:
    branches:
      - main
    paths:
      - "*.yaml"
      - "common/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.file }} / ${{ matrix.esphome-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        file:
          - athom-ld2450-sensor-test
          - athom-ps02c3-sensor-test
        esphome-version:
          - stable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ESPHome ${{ matrix.esphome-version }}
        uses: esphome/build-action@v7
        with:
          yaml-file: .github/test-configs/${{ matrix.file }}.yaml
          version: ${{ matrix.esphome-version }}
